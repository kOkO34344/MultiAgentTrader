# ===========================================================================
# Multi-Agent Options Desk — master configuration
#
# ${VAR} and ${VAR:-default} are interpolated from the environment (.env is
# loaded first). Everything here is validated into pydantic models by
# desk.utils.config_loader — a typo becomes a startup error, not a bad trade.
# ===========================================================================

config_version: "1.0.0"
experiment_id: "${DESK_EXPERIMENT_ID:-baseline-v1}"

# ---------------------------------------------------------------------------
# Broker — PAPER ONLY. client.py refuses any host that is not paper-api.
# ---------------------------------------------------------------------------
alpaca:
  api_key_id: "${ALPACA_API_KEY_ID:-}"
  api_secret_key: "${ALPACA_API_SECRET_KEY:-}"
  base_url: "${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}"
  data_feed: "${ALPACA_DATA_FEED:-iex}"      # iex (free) | sip (paid)
  paper_only: true                            # hard guard, do not disable
  max_retries: 4
  backoff_base_seconds: 0.6
  request_timeout_seconds: 30

# ---------------------------------------------------------------------------
# LLM layer. No ANTHROPIC_API_KEY -> every agent falls back to deterministic
# mock reasoning derived from the same market features (offline-safe).
# ---------------------------------------------------------------------------
llm:
  api_key: "${ANTHROPIC_API_KEY:-}"
  default_model: "claude-sonnet-5"
  max_tokens: 8000
  effort: "high"                              # low | medium | high | xhigh | max
  thinking: true                              # adaptive thinking
  timeout_seconds: 120
  # Per-agent overrides. Research agents gather and summarise evidence, which
  # Sonnet handles at a fraction of the spend; the seats that exercise judgement
  # — the committee that accepts or vetoes a trade, the coach that critiques the
  # desk's process, and the orchestrator that sequences the cycle — stay on Opus.
  models:
    orchestrator: "claude-opus-5"
    critic: "claude-opus-5"
    coach: "claude-opus-5"
    fundamental_analyst: "claude-sonnet-5"
    technical_analyst: "claude-sonnet-5"
    sentiment_analyst: "claude-sonnet-5"
    vol_options_strategist: "claude-sonnet-5"
    regime_agent: "claude-sonnet-5"
    event_agent: "claude-sonnet-5"
    storyteller: "claude-sonnet-5"

# ---------------------------------------------------------------------------
# Trading universe — deliberately small, liquid, options-rich.
# The Risk Guard rejects anything outside this whitelist.
# ---------------------------------------------------------------------------
universe:
  core: ["SPY", "QQQ", "IWM"]
  satellites: ["AAPL", "MSFT", "NVDA", "AMD", "AMZN", "META", "GOOGL", "TSLA"]
  max_active_tickers: 6
  min_underlying_price: 20.0
  min_avg_dollar_volume: 50000000.0

# ---------------------------------------------------------------------------
# Options contract selection filters (applied before any structure is built).
# ---------------------------------------------------------------------------
options:
  min_days_to_expiry: 7
  max_days_to_expiry: 60
  target_days_to_expiry: 30
  min_open_interest: 250
  min_volume: 10
  max_bid_ask_spread_pct: 0.12        # (ask-bid)/mid
  max_spread_abs: 0.60                # absolute $ cap on the spread
  contract_multiplier: 100
  strike_selection: "delta"           # delta | moneyness
  risk_free_rate: 0.043               # used by the Black-Scholes fallback

# ---------------------------------------------------------------------------
# RISK LIMITS — enforced deterministically in Python. The LLM cannot edit,
# argue with, or bypass these. Conservative by design.
# ---------------------------------------------------------------------------
risk_limits:
  # Notional
  max_notional_per_trade: 2500.0
  max_notional_total: 20000.0
  max_exposure_per_ticker: 5000.0
  max_contracts_per_ticker: 10
  max_contracts_per_trade: 5

  # Portfolio Greeks (per 1 share-equivalent, contracts already multiplied)
  max_delta_total: 250.0
  max_gamma_total: 25.0
  max_vega_total: 800.0
  max_theta_total: 400.0              # absolute value of net theta

  # Structure hygiene
  min_days_to_expiry: 7
  max_open_positions: 12
  max_trades_per_day: 6
  max_new_tickers_per_day: 3
  allow_undefined_risk: false         # naked short options => hard REJECT
  allow_naked_short_calls: false
  require_defined_max_loss: true

  # Capital
  min_cash_buffer_pct: 0.30           # keep >=30% of equity unencumbered
  max_buying_power_utilisation: 0.50
  max_daily_loss_pct: 0.03            # -3% day => halt new risk
  max_drawdown_halt_pct: 0.10         # -10% peak-to-trough => halt everything

# ---------------------------------------------------------------------------
# Regime classification. The deterministic classifier owns the label; the LLM
# may only override it above `llm_override_confidence`, and the override is
# always logged.
# ---------------------------------------------------------------------------
regime:
  benchmark: "SPY"
  lookback_days: 120
  fast_ema: 20
  slow_ema: 50
  adx_period: 14
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0

  thresholds:
    trend_adx_min: 22.0               # ADX above => trending
    trend_ema_slope_min: 0.0008       # normalised slope of the fast EMA
    range_bandwidth_max: 0.045        # Bollinger bandwidth => range-bound
    high_vol_iv_rank_min: 0.65        # IV rank of the benchmark
    high_vol_atr_pct_min: 0.020       # ATR / price
    event_window_days: 3              # days to a known binary event

  llm_override_confidence: 0.80
  labels: ["trend_up", "trend_down", "range", "high_vol_event"]

# ---------------------------------------------------------------------------
# Agent fan-out behaviour.
# ---------------------------------------------------------------------------
agents:
  timeout_seconds: 90
  max_candidates_per_agent: 3
  abstain_on_error: true              # a dead agent abstains, never kills the cycle
  enabled:
    fundamental_analyst: true
    technical_analyst: true
    sentiment_analyst: true
    vol_options_strategist: true
    regime_agent: true
    event_agent: true

critic:
  max_approved_trades: 3
  min_conviction: 0.55
  max_structures_per_ticker: 1
  reject_if_regime_mismatch: true

# ---------------------------------------------------------------------------
# Execution behaviour.
# ---------------------------------------------------------------------------
execution:
  dry_run: "${DESK_DRY_RUN:-true}"
  order_type: "limit"                 # limit | market  (limit strongly preferred)
  limit_price_mode: "mid"             # mid | mid_plus_edge
  marketable_edge_pct: 0.25           # cross the mid by this fraction of the spread (min 1 tick)
  time_in_force: "day"
  fill_poll_seconds: 3
  fill_timeout_seconds: 45
  cancel_unfilled: true
  round_limit_to: 0.01

# ---------------------------------------------------------------------------
# Competition mode — Aug 28 -> Sep 4. All times US/Eastern.
# ---------------------------------------------------------------------------
competition:
  enabled: true
  timezone: "America/New_York"
  start_date: "2026-08-28"
  end_date: "2026-09-04"

  schedule:
    premarket:
      at: "08:45"
      actions: ["load_config", "classify_regime", "select_watchlist"]
    morning:
      at: "10:00"
      actions: ["research", "critic", "risk_guard", "execute"]
      max_new_trades: 3
    midday:
      at: "13:30"
      actions: ["monitor", "adjust", "hedge"]
      max_new_trades: 1
    eod:
      at: "15:45"
      actions: ["flatten_expiring", "snapshot", "coach", "storyteller"]
      max_new_trades: 0

  # Weekly arc: explore -> concentrate -> freeze. `days` are TRADING days
  # elapsed since start_date, not calendar days.
  phases:
    - days: [1, 2]
      name: "exploration"
      size_multiplier: 0.5
      max_trades_per_day: 4
      allowed_playbooks: ["all"]
      freeze_prompts: false
    - days: [3, 4, 5]
      name: "concentration"
      size_multiplier: 1.0
      max_trades_per_day: 3
      allowed_playbooks: ["top_performers"]
      freeze_prompts: false
    - days: [6, 7, 8]
      name: "freeze"
      size_multiplier: 0.75
      max_trades_per_day: 2
      allowed_playbooks: ["top_performers"]
      freeze_prompts: true

# ---------------------------------------------------------------------------
# Backtesting.
# ---------------------------------------------------------------------------
backtest:
  start: "2025-01-02"
  end: "2025-06-30"
  initial_capital: 100000.0
  slippage_model: "half_spread"       # half_spread | fixed_pct | none
  fixed_slippage_pct: 0.01
  commission_per_contract: 0.65
  fill_probability: 0.95
  cache_dir: "data/cache"

# ---------------------------------------------------------------------------
# Monitoring / observability.
# ---------------------------------------------------------------------------
monitor:
  db_path: "monitor/state.db"
  heartbeat_path: "monitor/heartbeat.json"
  heartbeat_stale_seconds: 3600
  log_dir: "logs"
  log_level: "${DESK_LOG_LEVEL:-INFO}"
  dashboard_host: "${DESK_DASHBOARD_HOST:-127.0.0.1}"
  dashboard_port: "${DESK_DASHBOARD_PORT:-8787}"
  retain_traces_days: 90

social:
  output_dir: "social/daily_posts"
  platforms: ["x", "linkedin"]
  max_chars_x: 280
  hashtags: ["#AlpacaHackathon", "#AlgoTrading", "#ClaudeAI", "#Options"]
